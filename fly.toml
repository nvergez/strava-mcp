# fly.toml app configuration file generated for strava-mcp on 2026-02-15T16:57:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'strava-mcp'
primary_region = 'cdg'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  DB_PATH = '/data/strava-mcp.db'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/healthz'

[mounts]
  source = 'strava_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
